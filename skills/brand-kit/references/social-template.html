<!doctype html>
<!--
  Social composition template, filled by scripts/render.mjs (one page per composition).
  Placeholders: comp, width, height, font_faces, vars, has_art, mark_svg, wordmark_html,
  headline_html, tagline, eyebrow.

  This is a starting point, never the final look. Retune it per brand: the atmosphere (.art),
  the type scale, the placement. Copy it into the kit and pass it with --template.

  Rules the layout already respects, keep them when you retune:
  - x-banner and linkedin-banner: the lower left stays empty (the avatar / logo overlaps it).
  - story: the top and bottom 14% stay empty (platform UI).
  - og: nothing important in the outer 5%, some platforms crop it.
  - Text always sits on a clean ground: the atmosphere fades out before it reaches the copy.
  - No URL in small print, no social handle, no fake metric.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
{{font_faces}}
:root { {{vars}}; --w: {{width}}px; --h: {{height}}px; --u: calc(var(--h) / 100); --m: calc(var(--h) * 0.085); }
* { margin: 0; box-sizing: border-box; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--background); }
#comp { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: var(--text); font-family: var(--font-body); font-weight: var(--body-weight); }

/* Atmosphere: a diagonal ribbon of accent light with grain. Replace per brand (shader still, photo, pattern). */
.art { position: absolute; inset: 0; }
body[data-art="0"] .art {
  background:
    radial-gradient(60% 90% at 88% 30%, color-mix(in oklch, var(--accent) 78%, transparent) 0%, transparent 62%),
    radial-gradient(45% 70% at 70% 88%, color-mix(in oklch, var(--accent-dim) 60%, transparent) 0%, transparent 66%),
    conic-gradient(from 210deg at 82% 52%, transparent 0deg, color-mix(in oklch, var(--accent) 50%, transparent) 46deg, transparent 110deg);
  filter: blur(calc(var(--u) * 5)) saturate(1.15);
  -webkit-mask-image: linear-gradient(100deg, transparent 38%, #000 78%);
          mask-image: linear-gradient(100deg, transparent 38%, #000 78%);
}
body[data-art="1"] .art {
  background: var(--art) right center / cover no-repeat;
  -webkit-mask-image: linear-gradient(100deg, transparent 34%, #000 70%);
          mask-image: linear-gradient(100deg, transparent 34%, #000 70%);
}
.grain { position: absolute; inset: 0; opacity: 0.16; mix-blend-mode: overlay; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"); }

.accent { color: var(--accent); font-weight: inherit; }
.brandrow, .headline, .tagline, .eyebrow, .bigmark { position: absolute; }
.brandrow { display: flex; align-items: center; gap: 0.32em; font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1; white-space: nowrap; }
.brandrow svg { height: 1.25em; width: auto; flex: none; }
.headline { font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 0.98; text-wrap: balance; }
.tagline { line-height: 1.25; text-wrap: balance; }
.eyebrow { display: flex; align-items: center; gap: 0.9em; font-family: var(--font-mono); font-weight: var(--mono-weight); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.eyebrow::before { content: ""; width: 0.62em; height: 0.62em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0.9em var(--accent); flex: none; }
.eyebrow:empty, .tagline:empty { display: none; }
.bigmark { display: none; }
.bigmark svg { width: 100%; height: 100%; }

/* og 1200x630: brand row top left, headline centre left, eyebrow bottom left, atmosphere on the right third */
[data-comp="og"] .brandrow { left: var(--m); top: var(--m); font-size: calc(var(--u) * 6.6); }
[data-comp="og"] .headline { left: var(--m); top: 50%; transform: translateY(-46%); width: 62%; max-height: 52%; font-size: calc(var(--u) * 15); }
[data-comp="og"] .tagline { display: none; }
[data-comp="og"] .eyebrow { left: var(--m); bottom: var(--m); font-size: calc(var(--u) * 2.5); }

/* x-banner 1500x500: everything in the upper left half, lower left empty for the avatar */
[data-comp="x-banner"] .brandrow { left: 6%; top: 15%; font-size: calc(var(--u) * 15); }
[data-comp="x-banner"] .headline { display: none; }
[data-comp="x-banner"] .tagline { left: 6%; top: 39%; width: 44%; font-size: calc(var(--u) * 6.4); }
[data-comp="x-banner"] .eyebrow { left: 6%; top: 53%; font-size: calc(var(--u) * 3.1); }

/* linkedin-banner 1584x396: copy starts at 24% so the logo overlap stays clear */
[data-comp="linkedin-banner"] .brandrow { left: 24%; top: 20%; font-size: calc(var(--u) * 15); }
[data-comp="linkedin-banner"] .headline { display: none; }
[data-comp="linkedin-banner"] .tagline { left: 24%; top: 46%; width: 44%; font-size: calc(var(--u) * 7); }
[data-comp="linkedin-banner"] .eyebrow { left: 24%; top: 64%; font-size: calc(var(--u) * 3.6); }

/* community-banner 960x540: centred lockup and tagline */
body[data-comp="community-banner"] .art { -webkit-mask-image: radial-gradient(70% 70% at 50% 50%, transparent 30%, #000 100%); mask-image: radial-gradient(70% 70% at 50% 50%, transparent 30%, #000 100%); }
[data-comp="community-banner"] .brandrow { left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: calc(var(--u) * 13); }
[data-comp="community-banner"] .headline { display: none; }
[data-comp="community-banner"] .tagline { left: 15%; width: 70%; top: 56%; text-align: center; font-size: calc(var(--u) * 5); }
[data-comp="community-banner"] .eyebrow { left: 50%; bottom: var(--m); transform: translateX(-50%); font-size: calc(var(--u) * 2.6); }

/* square 1080: brand row top left, mark large in the centre, headline lower left */
[data-comp="square"] { --m: calc(var(--h) * 0.07); }
body[data-comp="square"] .art { -webkit-mask-image: radial-gradient(60% 45% at 50% 38%, #000 0%, transparent 100%); mask-image: radial-gradient(60% 45% at 50% 38%, #000 0%, transparent 100%); opacity: 0.55; }
[data-comp="square"] .brandrow { left: var(--m); top: var(--m); font-size: calc(var(--u) * 4.2); }
[data-comp="square"] .bigmark { display: block; left: 30%; width: 40%; top: 17%; height: 38%; }
[data-comp="square"] .headline { left: var(--m); bottom: calc(var(--m) + var(--u) * 7); width: 84%; max-height: 26%; font-size: calc(var(--u) * 9); }
[data-comp="square"] .headline { top: auto; }
[data-comp="square"] .tagline { display: none; }
[data-comp="square"] .eyebrow { left: var(--m); bottom: var(--m); font-size: calc(var(--u) * 1.9); }

/* story 1080x1920: top and bottom 14% empty */
[data-comp="story"] { --m: calc(var(--w) * 0.08); }
body[data-comp="story"] .art { -webkit-mask-image: radial-gradient(70% 34% at 50% 38%, #000 0%, transparent 100%); mask-image: radial-gradient(70% 34% at 50% 38%, #000 0%, transparent 100%); opacity: 0.6; }
[data-comp="story"] .brandrow { left: var(--m); top: 15%; font-size: calc(var(--u) * 2.6); }
[data-comp="story"] .bigmark { display: block; left: 28%; width: 44%; top: 26%; height: 24%; }
[data-comp="story"] .headline { left: var(--m); bottom: 22%; top: auto; width: 84%; max-height: 22%; font-size: calc(var(--u) * 5.4); }
[data-comp="story"] .tagline { display: none; }
[data-comp="story"] .eyebrow { left: var(--m); bottom: 16%; font-size: calc(var(--u) * 1.15); }
</style>
</head>
<body data-comp="{{comp}}" data-art="{{has_art}}">
<main id="comp">
  <div class="art"></div>
  <div class="grain"></div>
  <header class="brandrow">{{mark_svg}}<span>{{wordmark_html}}</span></header>
  <div class="bigmark">{{mark_svg}}</div>
  <h1 class="headline">{{headline_html}}</h1>
  <p class="tagline">{{tagline}}</p>
  <p class="eyebrow">{{eyebrow}}</p>
</main>
<script>
// Shrinks the headline until it fits its box, then reports any text still outside its box or the frame.
window.__fit = async () => {
  await document.fonts.ready;
  const frame = document.getElementById("comp").getBoundingClientRect();
  const h = document.querySelector(".headline");
  const shown = (el) => getComputedStyle(el).display !== "none";
  // max-height is the headline's box; a percentage resolves against the frame.
  const mh = getComputedStyle(h).maxHeight;
  const maxH = mh.endsWith("%") ? (frame.height * parseFloat(mh)) / 100 : parseFloat(mh) || Infinity;
  // The box is clamped to max-height, so the content is measured with scrollHeight.
  const tooBig = () => h.scrollHeight > maxH + 1 || h.scrollWidth > h.clientWidth + 1;
  if (shown(h)) {
    let size = parseFloat(getComputedStyle(h).fontSize);
    const min = size * 0.5;
    while (tooBig() && size > min) {
      size *= 0.96;
      h.style.fontSize = size + "px";
    }
  }
  const overflow = [];
  for (const el of document.querySelectorAll(".brandrow, .headline, .tagline, .eyebrow")) {
    if (!shown(el)) continue;
    const r = el.getBoundingClientRect();
    const out = r.left < frame.left - 1 || r.top < frame.top - 1 || r.right > frame.right + 1 || r.bottom > frame.bottom + 1;
    if (out || (el === h && tooBig())) overflow.push(el.className);
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return { overflow };
};
</script>
</body>
</html>
